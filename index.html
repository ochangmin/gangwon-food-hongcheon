<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#12283F"><title>강원 먹거리 이음</title>
<style>
:root{--navy:#12283F;--accent:#0B8893;--ink:#17263A;--ink2:#55626F;--line:#E3E9EC;--bg:#F3F6FB;--crit:#D3372E}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;background:linear-gradient(135deg,#12283F 0%,#183A4F 55%,#0E5F67 100%);color:var(--ink);display:grid;place-items:center;padding:20px;word-break:keep-all}
.card{width:min(400px,100%);background:#fff;border-radius:18px;padding:28px 26px 22px;box-shadow:0 18px 48px rgba(0,0,0,.28)}
.card img{height:36px;display:block;margin-bottom:12px}
h1{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}.sub{margin:0 0 20px;color:var(--ink2);font-size:13.5px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2)}
input[type=password],input[type=text]{display:block;width:100%;margin-top:6px;padding:12px 14px;font:600 17px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;border:1.5px solid var(--line);border-radius:11px;outline:none;text-transform:uppercase}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(11,136,147,.14)}
.row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 16px;font-size:13px;color:var(--ink2)}.row label{display:flex;gap:6px;align-items:center;font-weight:500}
.show{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:0}
button.go{width:100%;padding:13px;border:none;border-radius:11px;background:var(--accent);color:#fff;font:700 15.5px/1 inherit;font-family:inherit;cursor:pointer}button.go:disabled{opacity:.6;cursor:wait}
#m{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--crit)}
.ft{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:#8D9197;line-height:1.5;display:flex;gap:8px}
.ft svg{flex:none;width:16px;height:16px;color:var(--accent);margin-top:1px}
.spin{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:6px}.busy .spin{display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<main class="card">
  <img src="img/org-logo.png" alt="" onerror="this.remove()">
  <h1>강원 먹거리 이음</h1>

  <form id="f" autocomplete="on">
    <input type="text" name="username" value="gwfood" autocomplete="username" hidden>
    <label for="c">접속 코드</label>
    <input id="c" name="password" type="password" autocomplete="current-password" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required>
    <div class="row"><label><input type="checkbox" id="r" checked> 이 기기 기억 (30일)</label><button type="button" class="show" id="sh">코드 보기</button></div>
    <button class="go" id="b"><span class="spin"></span>들어가기</button>
    <p id="m" role="alert"></p>
  </form>

<script>
(async () => {
  const P = JSON.parse(document.getElementById('gw-payload').textContent);
  const $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  const b64url = a => {let s = '';for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');};
  const msg = t => {$('m').textContent = t;};
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined'){msg('이 브라우저에서는 열 수 없습니다. 최신 Chrome·Edge·Safari로 접속하세요.');$('b').disabled = true;return;}
  async function openWith(cekB64, grp, remember){
    const raw = b64(cekB64);
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const hk = await crypto.subtle.importKey('raw', raw, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    const tok = b64url(new Uint8Array(await crypto.subtle.sign('HMAC', hk, enc.encode('gw-gate-v1'))));
    document.cookie = 'gk=' + tok + '; Path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '') + (remember ? '; Max-Age=2592000' : '');
    try{if (remember) localStorage.setItem('gfl:gk', JSON.stringify({k:cekB64, exp:Date.now() + 30 * 864e5}));}catch(e){}
    if (!location.hash && grp){const h = {driver:'driver', sup:'sup', school:'del'}[grp];if (h) history.replaceState(null, '', location.pathname + location.search + '#' + h);}
    window.__GW_GATED = true;
    document.open();document.write(html);document.close();
  }
  // 기억된 기기
  try{const s = JSON.parse(localStorage.getItem('gfl:gk') || 'null');if (s && s.exp > Date.now()){await openWith(s.k, null, true);return;}}
  catch(e){try{localStorage.removeItem('gfl:gk');}catch(x){}}
  $('sh').onclick = () => {const c = $('c');c.type = c.type === 'password' ? 'text' : 'password';$('sh').textContent = c.type === 'password' ? '코드 보기' : '숨기기';};
  let fails = 0;
  $('f').addEventListener('submit', async e => {
    e.preventDefault();const code = $('c').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 8){msg('접속 코드를 정확히 입력하세요.');return;}
    $('b').disabled = true;$('f').classList.add('busy');msg('');
    try{
      const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
      const kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      let hit = null;
      for (const s of P.slots){try{hit = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(s.iv)}, kek, b64(s.w))));break;}catch(x){}}
      if (!hit){fails++;await new Promise(r => setTimeout(r, Math.min(8000, 600 * fails)));msg('접속 코드가 맞지 않습니다. 센터 담당자에게 문의하세요.');$('c').select();return;}
      await openWith(hit.k, hit.g, $('r').checked);
    }catch(x){msg('여는 중 문제가 생겼습니다: ' + (x.message || x));}
    finally{if ($('b')){$('b').disabled = false;$('f').classList.remove('busy');}}
  });
  $('c').focus();
})();
</script>
