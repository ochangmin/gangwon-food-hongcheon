name: Android 기사 앱 빌드
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: 안드로이드 SDK 확인 (러너 기본 설치본 사용)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3 && echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: 서명 키 준비 (저장소 Secrets에 있으면 사용)
        env: {KS_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}'}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks; echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; fi
      - name: APK 빌드
        env:
          KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk gwfood-driver.apk && ls -la gwfood-driver.apk
      - uses: actions/upload-artifact@v4
        with: {name: gwfood-driver, path: gwfood-driver.apk}
      - name: 사이트 다운로드 폴더에 올리기 (저장소가 비공개여도 급식.shop에서 받을 수 있게)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }} && git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          mkdir -p downloads && cp gwfood-driver.apk downloads/gwfood-driver.apk
          printf '{"build":%s,"sha":"%s","at":"%s"}\n' "${{ github.run_number }}" "${GITHUB_SHA::7}" "$(date -u +%FT%TZ)" > downloads/version.json
          git add downloads && git commit -m "기사 앱 빌드 ${{ github.run_number }} 배포" || exit 0
          for i in 1 2 3; do git push origin HEAD:${{ github.ref_name }} && break; git pull --rebase origin ${{ github.ref_name }}; done
