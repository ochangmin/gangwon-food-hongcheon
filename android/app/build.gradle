plugins { id 'com.android.application' }
def vCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
android {
    namespace 'kr.metaict.gwfood'
    compileSdk 34
    defaultConfig {
        applicationId 'kr.metaict.gwfood'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName "1.0." + vCode
    }
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) { storeFile file(ks); storePassword System.getenv('KEYSTORE_PASSWORD'); keyAlias System.getenv('KEY_ALIAS'); keyPassword System.getenv('KEY_PASSWORD') }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
