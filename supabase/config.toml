# 로컬 Supabase 설정 (supabase CLI start 용)
project_id = "gangwon-meal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
# 계정은 센터 관리자가 발급하므로 공개 가입은 막음
enable_signup = false

[auth.email]
# 주의: 로컬 CLI에서는 이 값이 '이메일 로그인 사용' 스위치를 겸함. false면 비밀번호 로그인도 막힘
# 공개 가입 차단은 위 [auth] enable_signup = false 로 처리
enable_signup = true
enable_confirmations = false
